# Goal Mode — конфигурация проекта
# Скопируй и адаптируй verify-команды под свой стек

active_goal: null  # путь к активной цели, напр. goals/my-goal

verify:
  test:
    command: "npm test"
    required: true
    timeout_seconds: 600
  lint:
    command: "npm run lint"
    required: true
    timeout_seconds: 300
  build:
    command: "npm run build"
    required: false
    timeout_seconds: 600
  typecheck:
    command: "npm run typecheck"
    required: false
    timeout_seconds: 300

# Примеры для других стеков (раскомментируй нужное):
# verify:
#   test: { command: "pytest", required: true }
#   lint: { command: "ruff check .", required: true }
#   typecheck: { command: "mypy .", required: false }

budget:
  max_iterations: 50
  max_hours: 8          # wall-clock бюджет (6+ часов); enforced через time-log + hooks
  max_tokens_hint: 2000000  # подсказка агенту, не hard limit

execution:
  mode: run_until_complete   # single_iteration | run_until_complete
  max_steps_per_session: 10
  stop_on: [COMPLETE, BLOCKED, FAILED, PAUSED]

drift:
  allowed_paths: []  # пусто = любые пути из плана; иначе whitelist префиксов

hooks:
  auto_continue_on_stop: true
  inject_goal_on_session_start: true
  max_continue_loops: 72     # ≥ budget.max_iterations; для 8h ≈ 32+ loops

memory:
  skill: memo-session-skill
  checkpoints:
    enabled: true
    on_phase_complete: full      # full | light | skip
    on_blocked: full
    on_complete: full
    on_session_limit: light      # before stop hook picks up next turn
    every_n_iterations: 10       # default: same as max_steps_per_session
  wiki:
    per_goal_page: true          # memory/wiki/goal-<goal-id>.md

time_tracking:
  enabled: true
  report_on_terminal: true       # SESSION_TIME_REPORT.md при COMPLETE/FAILED/BLOCKED/budget
  report_on_session_end: true    # обновлять отчёт при каждом stop-hook (промежуточно)
  log_activities: true           # parent логирует worker/verifier/planning через goal-time.js

cloud_agent:
  long_running: true
  auto_run: true
  max_duration_hours: 8          # лимит одной VM-сессии; automation продлевает дальше
  branch_prefix: "goal/"

# Модели: .cursor/goal.models.yml | UI: .cursor/agents/goal-*.md → model:
