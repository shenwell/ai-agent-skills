# Goal Mode — project configuration
# Copy and adapt verify commands for your stack

active_goal: null  # path to active goal, e.g. goals/my-goal

verify:
  test:
    command: "npm test"
    required: true
    timeout_seconds: 600
  lint:
    command: "npm run lint"
    required: true
    timeout_seconds: 300
  build:
    command: "npm run build"
    required: false
    timeout_seconds: 600
  typecheck:
    command: "npm run typecheck"
    required: false
    timeout_seconds: 300

# Examples for other stacks (uncomment as needed):
# verify:
#   test: { command: "pytest", required: true }
#   lint: { command: "ruff check .", required: true }
#   typecheck: { command: "mypy .", required: false }

budget:
  max_iterations: 50
  max_hours: 8          # wall-clock budget (6+ hours); enforced via time-log + hooks
  max_tokens_hint: 2000000  # hint for agent, not a hard limit

execution:
  mode: run_until_complete   # single_iteration | run_until_complete
  max_steps_per_session: 10
  stop_on: [COMPLETE, BLOCKED, FAILED, PAUSED]

drift:
  allowed_paths: []  # empty = any paths from plan; else prefix whitelist

hooks:
  auto_continue_on_stop: true
  inject_goal_on_session_start: true
  max_continue_loops: 72     # ≥ budget.max_iterations; for 8h ≈ 32+ loops

memory:
  skill: memo-session-skill
  checkpoints:
    enabled: true
    on_phase_complete: full      # full | light | skip
    on_blocked: full
    on_complete: full
    on_session_limit: light      # before stop hook picks up next turn
    every_n_iterations: 10       # default: same as max_steps_per_session
  wiki:
    per_goal_page: true          # memory/wiki/goal-<goal-id>.md

time_tracking:
  enabled: true
  report_on_terminal: true       # SESSION_TIME_REPORT.md on COMPLETE/FAILED/BLOCKED/budget
  report_on_session_end: true    # refresh report on each stop-hook (interim)
  log_activities: true           # parent logs worker/verifier/planning via goal-time.js

cloud_agent:
  long_running: true
  auto_run: true
  max_duration_hours: 8          # single VM session limit; automation extends beyond that
  branch_prefix: "goal/"

# Models: .cursor/goal.models.yml | UI: .cursor/agents/goal-*.md → model:
