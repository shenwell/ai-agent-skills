<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-labelledby="title desc">
  <title id="title">GOAL MODE</title>
  <desc id="desc">Open Goal Mode  Claude Code /goal for any agent</desc>
  <defs>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="840" height="200" rx="16" fill="#0b1220"/>
  <rect x="1" y="1" width="838" height="198" rx="15" fill="url(#glow)" stroke="url(#ink)" stroke-width="1.5"/>

  <text
    x="420" y="92"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="64"
    font-weight="800"
    letter-spacing="6"
    fill="url(#ink)"
    filter="url(#soft)"
  >GOAL MODE</text>

  <text
    x="420" y="132"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15"
    fill="#94a3b8"
  >Open Goal Mode  ·  Claude Code /goal for any agent</text>

  <text
    x="420" y="160"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="14"
    fill="#64748b"
  >Contract ’ Plan ’ Work Ä Verify ’ COMPLETE</text>
</svg>
